<div (keydown.enter)="onEnterKey($event)">
  <!-- id -->
  <div>
    <mat-form-field>
      <mat-label>ID</mat-label>
      <input matInput [formField]="form.id" />
      @if (form.id().getError("required") && (form.id().dirty() || form.id().touched())) {
      <mat-error>ID required</mat-error>
      } @if (form.id().getError("maxLength") && (form.id().dirty() || form.id().touched())) {
      <mat-error>ID too long</mat-error>
      }
    </mat-form-field>
  </div>
  <!-- ranges -->
  <div>
    <cadmus-cod-location
      [required]="true"
      [location]="form.ranges().value()"
      (locationChange)="onLocationChange($event)"
    />
  </div>

  <!-- buttons -->
  <div>
    <button
      type="button"
      mat-icon-button
      matTooltip="Discard changes"
      (click)="cancel()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Accept changes"
      [disabled]="form().invalid() || !form().dirty()"
      (click)="save()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
